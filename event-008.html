<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cardio Chipper">
<meta name="theme-color" content="#FAF9F5">
<title>Event 008 — Cardio Chipper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<style>
  :root{--ivory:#FAF9F5;--white:#FFFFFF;--slate:#141413;--clay:#D97757;--olive:#788C5D;
    --rust:#B04A3F;--oat:#E3DACC;--gray-150:#F0EEE6;--gray-300:#D1CFC5;--gray-500:#87867F;
    --gray-700:#3D3D3A;--border:1.5px solid var(--gray-300);--radius-panel:12px;--radius-row:8px;
    --radius-pill:999px;--serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,20,19,.04),0 4px 14px rgba(20,20,19,.05);
    --tint-olive:rgba(120,140,93,.16);--tint-rust:rgba(176,74,63,.14);--tint-clay:rgba(217,119,87,.08);}
  @media (prefers-color-scheme:dark){
    :root{--ivory:#121211;--white:#1C1C1A;--slate:#ECEAE2;--clay:#E08A6C;--olive:#93A878;
    --rust:#D06A5E;--oat:#2A2A26;--gray-150:#232320;--gray-300:#3A3A35;--gray-500:#8A897F;
    --gray-700:#ECEAE2;--border:1.5px solid var(--gray-300);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
    --tint-olive:rgba(147,168,120,.18);--tint-rust:rgba(208,106,94,.18);--tint-clay:rgba(224,138,108,.14);}}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{background:var(--ivory);color:var(--gray-700);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .page{max-width:560px;margin:0 auto;padding:18px 16px 40px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);}
  h1{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;font-size:26px;}
  .sub{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:2px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .topbar .titles{display:flex;flex-direction:column;gap:2px;}
  .card{background:var(--white);border:var(--border);border-radius:var(--radius-panel);
    padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .result{text-align:center;padding:6px 0 2px;}
  .result .big{font-family:var(--serif);font-weight:500;font-size:56px;letter-spacing:-.02em;
    color:var(--clay);line-height:1;}
  .result .big .unit{font-size:20px;color:var(--gray-500);margin-left:6px;font-family:var(--mono);}
  .result .caption{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:6px;}
  .result .detail{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:4px;}
  .chipper{display:flex;flex-direction:column;gap:8px;}
  .crow{padding:10px 12px;border:var(--border);border-radius:var(--radius-row);background:var(--ivory);
    transition:background .12s,border-color .12s;}
  .crow.done{background:var(--tint-olive);border-color:var(--olive);}
  .crow .etop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .crow .ex{font-size:14px;}
  .crow .ex .target{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-left:4px;}
  .crow .btns{display:flex;gap:6px;}
  .crow .emax,.crow .ezero{font-family:var(--mono);font-size:11px;padding:4px 10px;border:var(--border);
    border-radius:var(--radius-pill);background:var(--white);color:var(--olive);cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  .crow .ezero{color:var(--rust);}
  .crow .emax:active,.crow .ezero:active{transform:scale(.95);}
  .crow .reps{font-family:var(--mono);font-size:16px;padding:8px 10px;border:var(--border);
    border-radius:var(--radius-row);background:var(--white);color:var(--gray-700);
    text-align:center;width:100%;}
  .crow .reps:focus{outline:none;border-color:var(--clay);}
  .crow .reps.full{border-color:var(--olive);color:var(--olive);}
  .crow .reps.over{border-color:var(--rust);color:var(--rust);background:var(--tint-rust);}
  .amrap{margin-top:14px;padding:12px;border:var(--border);border-radius:var(--radius-row);
    background:var(--tint-clay);}
  .amrap .amrap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .amrap .amrap-label{font-family:var(--mono);font-size:13px;color:var(--clay);font-weight:600;}
  .amrap .amrap-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;}
  .amrap .reps{font-family:var(--mono);font-size:16px;padding:8px 10px;border:var(--border);
    border-radius:var(--radius-row);background:var(--white);color:var(--gray-700);
    text-align:center;width:100%;}
  .amrap .reps:focus{outline:none;border-color:var(--clay);}
  .amrap .ezero{font-family:var(--mono);font-size:11px;padding:4px 10px;border:var(--border);
    border-radius:var(--radius-pill);background:var(--white);color:var(--rust);cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  .amrap .ezero:active{transform:scale(.95);}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:var(--mono);font-size:13px;padding:10px 14px;border-radius:var(--radius-row);
    cursor:pointer;border:var(--border);background:var(--white);color:var(--gray-700);
    -webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;gap:6px;
    transition:transform .06s ease;}
  button:active{transform:scale(.97);}
  .btn-warn{background:var(--tint-rust);border-color:var(--rust);color:var(--rust);}
  .btn-ghost{background:transparent;}
  .foot{text-align:center;font-family:var(--mono);font-size:11px;color:var(--gray-500);margin-top:8px;}
  .foot a{color:var(--gray-500);text-decoration:none;}
</style>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="titles">
      <span class="eyebrow">Event 008 · Cardio Chipper</span>
      <h1>Cardio Chipper</h1>
      <span class="sub">12 min · chipper sequence + AMRAP burpees</span>
    </div>
  </div>

  <section class="card result score-sticky" aria-live="polite">
    <div class="big"><span id="total">0</span><span class="unit">reps</span></div>
    <div class="caption">total reps (chipper + AMRAP)</div>
    <div class="detail" id="detail"></div>
  </section>

  <section class="card">
    <div class="head">
      <span class="eyebrow">Chipper</span>
      <button id="clearBtn" class="btn-warn" style="padding:7px 12px;font-size:12px;">✕ Clear all</button>
    </div>
    <div class="chipper" id="chipper"></div>
    <div class="amrap">
      <div class="amrap-head">
        <span class="amrap-label">AMRAP · Burpees Over Line</span>
        <span class="amrap-label" id="amrapCount">0 reps</span>
      </div>
      <div class="amrap-row">
        <span style="font-size:14px;">Max Burpees</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <input class="reps" id="amrapInput" type="number" inputmode="numeric" min="0" step="1" placeholder="0" aria-label="AMRAP burpees" style="flex:1;">
          <button id="amrapZero" class="ezero" type="button">0</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card history-card">
    <div class="head"><span class="eyebrow">History</span><button id="clearHistoryBtn" class="btn-warn" type="button" style="padding:7px 12px;font-size:12px;">Clear history</button></div>
    <div id="history" class="history-list"></div>
  </section>

  <p class="foot"><a href="index.html">← All events</a> · Enter reps · AMRAP completes all rows</p>
</div>

<script src="assets/app.js"></script>
<script>
(function(){
  "use strict";
  var CHIPPER=[
    {name:"Lateral Burpees Over Line",target:30},
    {name:"Echo Ski Calories",target:30},
    {name:"Echo Bike Calories",target:30},
    {name:"Lateral Burpees Over Line",target:30},
    {name:"Echo Bike Calories",target:30},
    {name:"Echo Ski Calories",target:30}
  ];
  var LS_KEY="event008.state.v3";
  var EVENT_ID="008";

  function defaultState(){
    var s={chipper:[],amrap:0};
    for(var i=0;i<CHIPPER.length;i++) s.chipper.push(0);
    return s;
  }
  function validState(value){return !!value&&Array.isArray(value.chipper)&&value.chipper.length===CHIPPER.length;}
  function normalizeState(value){
    if(!validState(value)) return defaultState();
    value.amrap=parseInt(value.amrap,10)||0;return value;
  }
  function save(){XenomApp.write(LS_KEY,state);}

  var state=normalizeState(XenomApp.read(LS_KEY,defaultState(),validState));

  function rowReps(i){
    if(state.amrap>0) return CHIPPER[i].target;
    return state.chipper[i]||0;
  }
  function chipperTotal(){
    var t=0;
    for(var i=0;i<CHIPPER.length;i++) t+=rowReps(i);
    return t;
  }
  function totalReps(){
    return chipperTotal()+(state.amrap||0);
  }
  function isRowDone(i){
    return rowReps(i)>=CHIPPER[i].target;
  }

  function render(){
    var wrap=document.getElementById("chipper");
    wrap.innerHTML="";
    for(var i=0;i<CHIPPER.length;i++){
      (function(i){
        var d=CHIPPER[i];
        var row=document.createElement("div");
        row.className="crow"+(isRowDone(i)?" done":"");
        var etop=document.createElement("div");
        etop.className="etop";
        var ex=document.createElement("span");
        ex.className="ex";
        ex.innerHTML=d.name+' <span class="target">'+d.target+'</span>';
        var btns=document.createElement("div");
        btns.className="btns";
        var maxBtn=document.createElement("button");
        maxBtn.className="emax";maxBtn.type="button";maxBtn.textContent="max "+d.target;
        maxBtn.addEventListener("click",function(){
          state.chipper[i]=d.target;
          for(var m=0;m<i;m++){
            state.chipper[m]=CHIPPER[m].target;
          }
          save();render();
        });
        var zeroBtn=document.createElement("button");
        zeroBtn.className="ezero";zeroBtn.type="button";zeroBtn.textContent="0";
        zeroBtn.addEventListener("click",function(){
          state.chipper[i]=0;
          save();render();
        });
        btns.appendChild(maxBtn);btns.appendChild(zeroBtn);
        etop.appendChild(ex);etop.appendChild(btns);
        var val=state.chipper[i]||0;
        var inp=document.createElement("input");
        var isFull=(state.amrap>0)||(val>=d.target);
        inp.className="reps"+(isFull?" full":"")+(val>d.target?" over":"");
        inp.type="number";inp.min="0";inp.step="1";inp.inputMode="numeric";
        inp.value=state.amrap>0?d.target:(val||"");inp.placeholder="0";
        inp.setAttribute("aria-label",d.name+" "+(i+1));
        inp.addEventListener("input",function(){
          var v=parseInt(inp.value,10)||0;
          state.chipper[i]=v;
          if(v>0){
            for(var m=0;m<i;m++){
              state.chipper[m]=CHIPPER[m].target;
            }
          }
          save();render();
        });
        row.appendChild(etop);row.appendChild(inp);
        wrap.appendChild(row);
      })(i);
    }
    document.getElementById("amrapInput").value=state.amrap||"";
    renderTotal();
    renderHistory();
  }
  function renderTotal(){
    var t=totalReps();
    document.getElementById("total").textContent=t;
    document.getElementById("detail").textContent=chipperTotal()+" chipper · "+(state.amrap||0)+" AMRAP";
    document.getElementById("amrapCount").textContent=(state.amrap||0)+" reps";
  }
  function renderHistory(){
    XenomApp.renderHistory(EVENT_ID,{validateState:validState,onRestore:function(savedState){
      state=normalizeState(savedState);save();render();window.scrollTo({top:0,behavior:"smooth"});
    }});
  }

  document.getElementById("amrapInput").addEventListener("input",function(){
    state.amrap=parseInt(this.value,10)||0;
    save();render();
  });
  document.getElementById("amrapZero").addEventListener("click",function(){
    state.amrap=0;
    save();render();
  });
  document.getElementById("clearBtn").addEventListener("click",function(){
    if(totalReps()>0) XenomApp.archive(EVENT_ID,state,totalReps(),chipperTotal()+" chipper · "+(state.amrap||0)+" AMRAP");
    state=defaultState();save();render();
  });
  render();
})();
</script>
</body>
</html>
