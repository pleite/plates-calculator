<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="C2B">
<meta name="theme-color" content="#FAF9F5">
<title>Event 003 — C2B · 8 rounds</title>
<style>
  :root {
    --ivory:    #FAF9F5;
    --white:    #FFFFFF;
    --slate:    #141413;
    --clay:     #D97757;
    --olive:    #788C5D;
    --rust:     #B04A3F;
    --oat:      #E3DACC;
    --gray-150: #F0EEE6;
    --gray-300: #D1CFC5;
    --gray-500: #87867F;
    --gray-700: #3D3D3A;
    --border: 1.5px solid var(--gray-300);
    --radius-panel: 12px;
    --radius-row: 8px;
    --radius-pill: 999px;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans:  system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(20,20,19,.04), 0 4px 14px rgba(20,20,19,.05);
    --tint-olive: rgba(120,140,93,.16);
    --tint-rust: rgba(176,74,63,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ivory:    #121211;
      --white:    #1C1C1A;
      --slate:    #ECEAE2;
      --clay:     #E08A6C;
      --olive:    #93A878;
      --rust:     #D06A5E;
      --oat:      #2A2A26;
      --gray-150: #232320;
      --gray-300: #3A3A35;
      --gray-500: #8A897F;
      --gray-700: #ECEAE2;
      --border: 1.5px solid var(--gray-300);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
      --tint-olive: rgba(147,168,120,.18);
      --tint-rust: rgba(208,106,94,.18);
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body {
    background:var(--ivory); color:var(--gray-700);
    font-family:var(--sans); line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .page { max-width:560px; margin:0 auto; padding:18px 16px 40px; }

  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.08em;
             text-transform:uppercase; color:var(--gray-500); }
  h1 { font-family:var(--serif); font-weight:500; letter-spacing:-.01em; font-size:26px; }
  .sub { font-family:var(--mono); font-size:12px; color:var(--gray-500); margin-top:2px; }
  .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .topbar .titles { display:flex; flex-direction:column; gap:2px; }

  .card { background:var(--white); border:var(--border); border-radius:var(--radius-panel);
          padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card .head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }

  /* ---- total band ---- */
  .result { text-align:center; padding:6px 0 2px; }
  .result .big { font-family:var(--serif); font-weight:500; font-size:56px; letter-spacing:-.02em;
                 color:var(--clay); line-height:1; }
  .result .big .unit { font-size:20px; color:var(--gray-500); margin-left:6px; font-family:var(--mono); }
  .result .caption { font-family:var(--mono); font-size:12px; color:var(--gray-500); margin-top:6px; }
  .result .detail { font-family:var(--mono); font-size:12px; color:var(--gray-500); margin-top:4px; }

  /* ---- round rows ---- */
  .rounds { display:flex; flex-direction:column; gap:8px; }
  .round {
    display:grid; grid-template-columns:36px 1fr 64px 80px; gap:10px; align-items:center;
    padding:10px 12px; border:var(--border); border-radius:var(--radius-row);
    background:var(--ivory); transition:background .12s, border-color .12s;
  }
  .round.good { background:var(--tint-olive); border-color:var(--olive); }
  .round.foul { opacity:.55; }
  .round .num { font-family:var(--mono); font-size:14px; color:var(--gray-500); text-align:center; }
  .round.good .num { color:var(--olive); }
  .round .label { font-size:14px; }
  .round .toggle {
    font-family:var(--mono); font-size:12px; padding:7px 10px; border-radius:var(--radius-row);
    border:var(--border); background:var(--white); color:var(--gray-500); cursor:pointer;
    -webkit-tap-highlight-color:transparent; text-align:center;
  }
  .round.good .toggle { background:var(--olive); color:var(--ivory); border-color:var(--olive); }
  .round .reps {
    font-family:var(--mono); font-size:16px; padding:8px 10px; border:var(--border);
    border-radius:var(--radius-row); background:var(--white); color:var(--gray-700);
    text-align:center; width:100%;
  }
  .round .reps:focus { outline:none; border-color:var(--clay); }

  /* ---- nav arrows ---- */
  .nav { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:12px; }
  .nav button {
    font-family:var(--mono); font-size:18px; padding:8px 16px; border-radius:var(--radius-row);
    border:var(--border); background:var(--white); color:var(--gray-700); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .nav button:active { transform:scale(.95); }
  .nav .round-label { font-family:var(--mono); font-size:13px; color:var(--gray-500); min-width:80px; text-align:center; }

  /* ---- buttons ---- */
  .btnrow { display:flex; gap:10px; flex-wrap:wrap; }
  button {
    font-family:var(--mono); font-size:13px; padding:10px 14px; border-radius:var(--radius-row);
    cursor:pointer; border:var(--border); background:var(--white); color:var(--gray-700);
    -webkit-tap-highlight-color:transparent; display:inline-flex; align-items:center; gap:6px;
    transition:transform .06s ease;
  }
  button:active { transform:scale(.97); }
  .btn-warn { background:var(--tint-rust); border-color:var(--rust); color:var(--rust); }
  .btn-ghost { background:transparent; }

  .foot { text-align:center; font-family:var(--mono); font-size:11px; color:var(--gray-500); margin-top:8px; }
  .foot a { color:var(--gray-500); text-decoration:none; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="titles">
      <span class="eyebrow">Event 003 · C2B</span>
      <h1>C2B</h1>
      <span class="sub">8 rounds · sum of good reps</span>
    </div>
  </div>

  <!-- TOTAL -->
  <section class="card result">
    <div class="big"><span id="total">0</span><span class="unit">reps</span></div>
    <div class="caption">total good reps</div>
    <div class="detail" id="detail"></div>
  </section>

  <!-- NAV -->
  <div class="nav">
    <button id="prevBtn" aria-label="Previous round">←</button>
    <span class="round-label" id="navLabel">Round 1 / 8</span>
    <button id="nextBtn" aria-label="Next round">→</button>
  </div>

  <!-- ROUNDS -->
  <section class="card">
    <div class="head">
      <span class="eyebrow">Rounds</span>
      <button id="clearBtn" class="btn-warn" style="padding:7px 12px;font-size:12px;">✕ Clear all</button>
    </div>
    <div class="rounds" id="rounds"></div>
  </section>

  <p class="foot"><a href="index.html">← All events</a> · Tap GOOD/FOUL to toggle · Enter reps per round</p>
</div>

<script>
(function () {
  "use strict";

  var ROUNDS = 8;
  var LS_KEY = "c2b.rounds.v1";

  // state: array of { good: bool, reps: number }
  var state = load(LS_KEY, defaultState());
  var currentRound = 0; // 0-indexed

  function defaultState() {
    var s = [];
    for (var i = 0; i < ROUNDS; i++) s.push({ good: false, reps: 0 });
    return s;
  }
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (raw == null) return fallback;
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length !== ROUNDS) return fallback;
      return parsed;
    } catch(e) { return fallback; }
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function totalReps() {
    var t = 0, good = 0, foul = 0;
    for (var i = 0; i < ROUNDS; i++) {
      if (state[i].good) { t += state[i].reps; good++; }
      else foul++;
    }
    return { total: t, good: good, foul: foul };
  }

  function render() {
    var wrap = document.getElementById("rounds");
    wrap.innerHTML = "";
    for (var i = 0; i < ROUNDS; i++) {
      (function(i) {
        var r = state[i];
        var el = document.createElement("div");
        el.className = "round" + (r.good ? " good" : (r.reps > 0 ? " foul" : ""));
        el.id = "round-" + i;

        var num = document.createElement("span");
        num.className = "num"; num.textContent = i + 1;

        var label = document.createElement("span");
        label.className = "label"; label.textContent = "Round " + (i + 1);

        var toggle = document.createElement("button");
        toggle.className = "toggle";
        toggle.textContent = r.good ? "GOOD" : "FOUL";
        toggle.setAttribute("aria-label", "Toggle round " + (i+1) + " good/foul");
        toggle.addEventListener("click", function() {
          state[i].good = !state[i].good;
          save(); render();
        });

        var reps = document.createElement("input");
        reps.className = "reps"; reps.type = "number"; reps.min = "0"; reps.step = "1";
        reps.value = r.reps || ""; reps.placeholder = "0";
        reps.setAttribute("aria-label", "Reps for round " + (i+1));
        reps.addEventListener("input", function() {
          state[i].reps = parseInt(reps.value, 10) || 0;
          save(); renderTotal();
        });

        el.appendChild(num); el.appendChild(label); el.appendChild(toggle); el.appendChild(reps);
        wrap.appendChild(el);
      })(i);
    }
    renderTotal();
    renderNav();
  }

  function renderTotal() {
    var t = totalReps();
    document.getElementById("total").textContent = t.total;
    document.getElementById("detail").textContent =
      t.good + " good · " + t.foul + " foul";
  }

  function renderNav() {
    document.getElementById("navLabel").textContent =
      "Round " + (currentRound + 1) + " / " + ROUNDS;
    document.getElementById("prevBtn").disabled = currentRound === 0;
    document.getElementById("nextBtn").disabled = currentRound === ROUNDS - 1;
    // scroll current into view
    var el = document.getElementById("round-" + currentRound);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // wiring
  document.getElementById("prevBtn").addEventListener("click", function() {
    if (currentRound > 0) { currentRound--; renderNav(); }
  });
  document.getElementById("nextBtn").addEventListener("click", function() {
    if (currentRound < ROUNDS - 1) { currentRound++; renderNav(); }
  });
  document.getElementById("clearBtn").addEventListener("click", function() {
    state = defaultState(); save(); render();
  });

  render();
})();
</script>
</body>
</html>
