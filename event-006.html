<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gymnastics Sprint">
<meta name="theme-color" content="#FAF9F5">
<title>Event 006 — Complex Gymnastics Sprint</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<style>
  :root{--ivory:#FAF9F5;--white:#FFFFFF;--slate:#141413;--clay:#D97757;--olive:#788C5D;
    --rust:#B04A3F;--oat:#E3DACC;--gray-150:#F0EEE6;--gray-300:#D1CFC5;--gray-500:#87867F;
    --gray-700:#3D3D3A;--border:1.5px solid var(--gray-300);--radius-panel:12px;--radius-row:8px;
    --radius-pill:999px;--serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,20,19,.04),0 4px 14px rgba(20,20,19,.05);
    --tint-olive:rgba(120,140,93,.16);--tint-rust:rgba(176,74,63,.14);--tint-clay:rgba(217,119,87,.08);}
  @media (prefers-color-scheme:dark){
    :root{--ivory:#121211;--white:#1C1C1A;--slate:#ECEAE2;--clay:#E08A6C;--olive:#93A878;
    --rust:#D06A5E;--oat:#2A2A26;--gray-150:#232320;--gray-300:#3A3A35;--gray-500:#8A897F;
    --gray-700:#ECEAE2;--border:1.5px solid var(--gray-300);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
    --tint-olive:rgba(147,168,120,.18);--tint-rust:rgba(208,106,94,.18);--tint-clay:rgba(224,138,108,.14);}}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{background:var(--ivory);color:var(--gray-700);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .page{max-width:560px;margin:0 auto;padding:18px 16px 40px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);}
  h1{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;font-size:26px;}
  .sub{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:2px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .topbar .titles{display:flex;flex-direction:column;gap:2px;}
  .card{background:var(--white);border:var(--border);border-radius:var(--radius-panel);
    padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .result{text-align:center;padding:6px 0 2px;}
  .result .big{font-family:var(--serif);font-weight:500;font-size:56px;letter-spacing:-.02em;
    color:var(--clay);line-height:1;}
  .result .big .unit{font-size:20px;color:var(--gray-500);margin-left:6px;font-family:var(--mono);}
  .result .caption{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:6px;}
  .result .detail{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:4px;}
  .nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px;}
  .nav button{font-family:var(--mono);font-size:18px;padding:8px 16px;border-radius:var(--radius-row);
    border:var(--border);background:var(--white);color:var(--gray-700);cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  .nav button:active{transform:scale(.95);}
  .nav button:disabled{opacity:.3;}
  .nav .round-label{font-family:var(--mono);font-size:13px;color:var(--gray-500);min-width:110px;text-align:center;}
  .round{border:var(--border);border-radius:var(--radius-row);background:var(--ivory);padding:14px;}
  .round .rhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .round .rnum{font-family:var(--mono);font-size:13px;color:var(--gray-500);}
  .round .rsum{font-family:var(--mono);font-size:13px;color:var(--gray-500);}
  .exline{padding:9px 0;}
  .exline + .exline{border-top:1px dashed var(--gray-300);}
  .exline .etop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .exline .elabel{font-size:15px;}
  .exline .elabel .target{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-left:4px;}
  .exline .btns{display:flex;gap:6px;}
  .exline .emax,.exline .ezero{font-family:var(--mono);font-size:11px;padding:4px 10px;border:var(--border);
    border-radius:var(--radius-pill);background:var(--white);color:var(--olive);cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  .exline .ezero{color:var(--rust);}
  .exline .emax:active,.exline .ezero:active{transform:scale(.95);}
  .exline .reps{font-family:var(--mono);font-size:16px;padding:9px 10px;border:var(--border);
    border-radius:var(--radius-row);background:var(--white);color:var(--gray-700);
    text-align:center;width:100%;}
  .exline .reps:focus{outline:none;border-color:var(--clay);}
  .exline .reps.full{border-color:var(--olive);color:var(--olive);}
  .exline .reps.over{border-color:var(--rust);color:var(--rust);background:var(--tint-rust);}
  .progress{display:flex;gap:5px;margin-top:14px;}
  .progress .dot{flex:1;height:5px;border-radius:3px;background:var(--gray-300);}
  .progress .dot.done{background:var(--olive);}
  .progress .dot.cur{background:var(--clay);}
  .amrap{margin-top:14px;padding:12px;border:var(--border);border-radius:var(--radius-row);
    background:var(--tint-clay);}
  .amrap .amrap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .amrap .amrap-label{font-family:var(--mono);font-size:13px;color:var(--clay);font-weight:600;}
  .amrap .amrap-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;}
  .amrap .reps{font-family:var(--mono);font-size:16px;padding:8px 10px;border:var(--border);
    border-radius:var(--radius-row);background:var(--white);color:var(--gray-700);
    text-align:center;width:100%;min-width:80px;}
  .amrap .reps:focus{outline:none;border-color:var(--clay);}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:var(--mono);font-size:13px;padding:10px 14px;border-radius:var(--radius-row);
    cursor:pointer;border:var(--border);background:var(--white);color:var(--gray-700);
    -webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;gap:6px;
    transition:transform .06s ease;}
  button:active{transform:scale(.97);}
  .btn-warn{background:var(--tint-rust);border-color:var(--rust);color:var(--rust);}
  .foot{text-align:center;font-family:var(--mono);font-size:11px;color:var(--gray-500);margin-top:8px;}
  .foot a{color:var(--gray-500);text-decoration:none;}
</style>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="titles">
      <span class="eyebrow">Event 006 · Gymnastics Sprint</span>
      <h1>Complex Gymnastics Sprint</h1>
      <span class="sub">6 min · 3×(15 T2R + 10 DB HS → 10 PU) + AMRAP C2B</span>
    </div>
  </div>

  <section class="card result score-sticky" aria-live="polite">
    <div class="big"><span id="total">0</span><span class="unit">reps</span></div>
    <div class="caption">total reps</div>
    <div class="detail" id="detail"></div>
  </section>

  <div class="nav action-nav">
    <button id="prevBtn" aria-label="Previous round">←</button>
    <span class="round-label" id="navLabel">Round 1 / 3</span>
    <button id="nextBtn" aria-label="Next round">→</button>
  </div>

  <section class="card">
    <div class="head">
      <span class="eyebrow" id="cardTitle">Round 1</span>
      <button id="clearBtn" class="btn-warn" style="padding:7px 12px;font-size:12px;">✕ Clear all</button>
    </div>
    <div class="round" id="roundCard"></div>
    <div class="progress" id="progress"></div>
    <div class="amrap">
      <div class="amrap-head">
        <span class="amrap-label">AMRAP · Chest to Bar</span>
        <span class="amrap-label" id="amrapCount">0 reps</span>
      </div>
      <div class="amrap-row">
        <span style="font-size:14px;">Max C2B Pull-Ups</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <input class="reps" id="amrapInput" type="number" inputmode="numeric" min="0" step="1" placeholder="0" aria-label="AMRAP C2B" style="flex:1;">
          <button id="amrapZero" class="ezero" type="button" style="font-family:var(--mono);font-size:11px;padding:4px 10px;border:var(--border);border-radius:var(--radius-pill);background:var(--white);color:var(--rust);cursor:pointer;-webkit-tap-highlight-color:transparent;">0</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card history-card">
    <div class="head"><span class="eyebrow">History</span><button id="clearHistoryBtn" class="btn-warn" type="button" style="padding:7px 12px;font-size:12px;">Clear history</button></div>
    <div id="history" class="history-list"></div>
  </section>

  <p class="foot"><a href="index.html">← All events</a> · Enter reps · AMRAP completes all rounds</p>
</div>

<script src="assets/app.js"></script>
<script>
(function(){
  "use strict";
  var ROUNDS=3;
  var EXERCISES=[
    {name:"Toes to Rings",target:15},
    {name:"DB Hang Snatches",target:10},
    {name:"Pull-Ups",target:10}
  ];
  function roundTargetSum(){
    var s=0;
    for(var i=0;i<EXERCISES.length;i++) s+=EXERCISES[i].target;
    return s;
  }
  var LS_KEY="event006.state.v3";
  var EVENT_ID="006";

  function defaultState(){
    var s={rounds:[],amrap:0,cur:0};
    for(var i=0;i<ROUNDS;i++) s.rounds.push({});
    return s;
  }
  function validState(value){return !!value&&Array.isArray(value.rounds)&&value.rounds.length===ROUNDS;}
  function normalizeState(value){
    if(!validState(value)) return defaultState();
    if(typeof value.cur!=="number"||value.cur<0||value.cur>=ROUNDS) value.cur=ROUNDS-1;
    value.amrap=parseInt(value.amrap,10)||0;return value;
  }
  function save(){XenomApp.write(LS_KEY,state);}

  var state=normalizeState(XenomApp.read(LS_KEY,defaultState(),validState));
  var currentRound=state.cur;

  function roundHasValue(i){
    var r=state.rounds[i];
    for(var k in r){ if((r[k]||0)>0) return true; }
    return false;
  }
  function roundReps(i){
    if((i<currentRound)||(state.amrap>0)) return roundTargetSum();
    var r=state.rounds[i],t=0;
    for(var k in r) t+=(r[k]||0);
    return t;
  }
  function roundsTotal(){
    var t=0;
    for(var i=0;i<ROUNDS;i++) t+=roundReps(i);
    return t;
  }
  function totalReps(){
    return roundsTotal()+(state.amrap||0);
  }
  function roundsDone(){
    if(state.amrap>0) return ROUNDS;
    var n=currentRound;
    if(roundHasValue(currentRound)) n++;
    return n;
  }

  function render(){
    state.cur=currentRound;
    var card=document.getElementById("roundCard");
    card.innerHTML="";
    var r=state.rounds[currentRound];
    var head=document.createElement("div");
    head.className="rhead";
    var num=document.createElement("span");
    num.className="rnum";num.textContent="Round "+(currentRound+1);
    var sum=document.createElement("span");
    var curSum=state.amrap>0?roundTargetSum():0;
    if(state.amrap>0){curSum=roundTargetSum();}
    else{for(var k in r) curSum+=(r[k]||0);}
    sum.className="rsum";sum.textContent=curSum+" reps";
    head.appendChild(num);head.appendChild(sum);
    card.appendChild(head);
    for(var j=0;j<EXERCISES.length;j++){
      (function(j){
        var ex=EXERCISES[j];
        var line=document.createElement("div");
        line.className="exline";
        var etop=document.createElement("div");
        etop.className="etop";
        var lab=document.createElement("span");
        lab.className="elabel";
        lab.innerHTML=ex.name+' <span class="target">'+ex.target+'</span>';
        var btns=document.createElement("div");
        btns.className="btns";
        var maxBtn=document.createElement("button");
        maxBtn.className="emax";maxBtn.type="button";maxBtn.textContent="max "+ex.target;
        maxBtn.addEventListener("click",function(){
          state.rounds[currentRound][ex.name]=ex.target;
          save();render();
        });
        var zeroBtn=document.createElement("button");
        zeroBtn.className="ezero";zeroBtn.type="button";zeroBtn.textContent="0";
        zeroBtn.addEventListener("click",function(){
          state.rounds[currentRound][ex.name]=0;
          save();render();
        });
        btns.appendChild(maxBtn);btns.appendChild(zeroBtn);
        etop.appendChild(lab);etop.appendChild(btns);
        var inp=document.createElement("input");
        var val=r[ex.name]||0;
        var isFull=(state.amrap>0)||(val>=ex.target);
        inp.className="reps"+(isFull?" full":"")+(val>ex.target?" over":"");
        inp.type="number";inp.min="0";inp.step="1";inp.inputMode="numeric";
        inp.value=state.amrap>0?ex.target:(val||"");inp.placeholder="0";
        inp.setAttribute("aria-label",ex.name+" round "+(currentRound+1));
        inp.addEventListener("input",function(){
          var v=parseInt(inp.value,10)||0;
          state.rounds[currentRound][ex.name]=v;
          if(v>0){
            for(var m=0;m<j;m++){
              state.rounds[currentRound][EXERCISES[m].name]=EXERCISES[m].target;
            }
          }
          save();render();
        });
        line.appendChild(etop);line.appendChild(inp);
        card.appendChild(line);
      })(j);
    }
    var prog=document.getElementById("progress");
    prog.innerHTML="";
    for(var i=0;i<ROUNDS;i++){
      var d=document.createElement("span");
      var cls="dot";
      if(state.amrap>0) cls+=" done";
      else if(i<currentRound) cls+=" done";
      else if(i===currentRound) cls+=" cur";
      d.className=cls;
      prog.appendChild(d);
    }
    document.getElementById("amrapInput").value=state.amrap||"";
    renderTotal();
    renderNav();
    renderHistory();
  }
  function renderTotal(){
    document.getElementById("total").textContent=totalReps();
    document.getElementById("detail").textContent=roundsTotal()+" rounds · "+(state.amrap||0)+" AMRAP";
    document.getElementById("cardTitle").textContent="Round "+(currentRound+1);
    document.getElementById("amrapCount").textContent=(state.amrap||0)+" reps";
  }
  function renderNav(){
    if(state.amrap>0){
      document.getElementById("navLabel").textContent="All rounds complete";
    } else {
      document.getElementById("navLabel").textContent="Round "+(currentRound+1)+" / "+ROUNDS;
    }
    document.getElementById("prevBtn").disabled=currentRound===0||state.amrap>0;
    document.getElementById("nextBtn").disabled=currentRound===ROUNDS-1||state.amrap>0;
  }
  function renderHistory(){
    XenomApp.renderHistory(EVENT_ID,{validateState:validState,onRestore:function(savedState){
      state=normalizeState(savedState);currentRound=state.cur;save();render();window.scrollTo({top:0,behavior:"smooth"});
    }});
  }

  document.getElementById("amrapInput").addEventListener("input",function(){
    state.amrap=parseInt(this.value,10)||0;
    save();render();
  });
  document.getElementById("amrapZero").addEventListener("click",function(){
    state.amrap=0;
    save();render();
  });
  document.getElementById("prevBtn").addEventListener("click",function(){
    if(currentRound>0){currentRound--;render();}
  });
  document.getElementById("nextBtn").addEventListener("click",function(){
    if(currentRound<ROUNDS-1){currentRound++;render();}
  });
  document.getElementById("clearBtn").addEventListener("click",function(){
    if(totalReps()>0) XenomApp.archive(EVENT_ID,state,totalReps(),roundsDone()+" of "+ROUNDS+" rounds · "+(state.amrap||0)+" AMRAP");
    state=defaultState();currentRound=0;save();render();
  });
  render();
})();
</script>
</body>
</html>
