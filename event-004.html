<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Barbell Cycling">
<meta name="theme-color" content="#FAF9F5">
<title>Event 004 — Barbell Cycling · AMRAP</title>
<style>
  :root{--ivory:#FAF9F5;--white:#FFFFFF;--slate:#141413;--clay:#D97757;--olive:#788C5D;
    --rust:#B04A3F;--oat:#E3DACC;--gray-150:#F0EEE6;--gray-300:#D1CFC5;--gray-500:#87867F;
    --gray-700:#3D3D3A;--border:1.5px solid var(--gray-300);--radius-panel:12px;--radius-row:8px;
    --radius-pill:999px;--serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(20,20,19,.04),0 4px 14px rgba(20,20,19,.05);
    --tint-olive:rgba(120,140,93,.16);--tint-rust:rgba(176,74,63,.14);}
  @media (prefers-color-scheme:dark){
    :root{--ivory:#121211;--white:#1C1C1A;--slate:#ECEAE2;--clay:#E08A6C;--olive:#93A878;
    --rust:#D06A5E;--oat:#2A2A26;--gray-150:#232320;--gray-300:#3A3A35;--gray-500:#8A897F;
    --gray-700:#ECEAE2;--border:1.5px solid var(--gray-300);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
    --tint-olive:rgba(147,168,120,.18);--tint-rust:rgba(208,106,94,.18);}}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{background:var(--ivory);color:var(--gray-700);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .page{max-width:560px;margin:0 auto;padding:18px 16px 40px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);}
  h1{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;font-size:26px;}
  .sub{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:2px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .topbar .titles{display:flex;flex-direction:column;gap:2px;}
  .card{background:var(--white);border:var(--border);border-radius:var(--radius-panel);
    padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .result{text-align:center;padding:6px 0 2px;}
  .result .big{font-family:var(--serif);font-weight:500;font-size:56px;letter-spacing:-.02em;
    color:var(--clay);line-height:1;}
  .result .big .unit{font-size:20px;color:var(--gray-500);margin-left:6px;font-family:var(--mono);}
  .result .caption{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:6px;}
  .result .detail{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-top:4px;}
  .nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px;}
  .nav button{font-family:var(--mono);font-size:18px;padding:8px 16px;border-radius:var(--radius-row);
    border:var(--border);background:var(--white);color:var(--gray-700);cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  .nav button:active{transform:scale(.95);}
  .nav button:disabled{opacity:.3;}
  .nav .round-label{font-family:var(--mono);font-size:13px;color:var(--gray-500);min-width:90px;text-align:center;}
  .rounds{display:flex;flex-direction:column;gap:10px;}
  .round{border:var(--border);border-radius:var(--radius-row);background:var(--ivory);
    padding:12px;transition:background .12s,border-color .12s;}
  .round.done{background:var(--tint-olive);border-color:var(--olive);}
  .round .rhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .round .rnum{font-family:var(--mono);font-size:13px;color:var(--gray-500);}
  .round.done .rnum{color:var(--olive);}
  .round .rsum{font-family:var(--mono);font-size:13px;color:var(--gray-500);}
  .round.done .rsum{color:var(--olive);}
  .exline{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center;padding:7px 0;}
  .exline + .exline{border-top:1px dashed var(--gray-300);}
  .exline .elabel{font-size:14px;}
  .exline .elabel .target{font-family:var(--mono);font-size:12px;color:var(--gray-500);margin-left:4px;}
  .exline .reps{font-family:var(--mono);font-size:16px;padding:8px 10px;border:var(--border);
    border-radius:var(--radius-row);background:var(--white);color:var(--gray-700);
    text-align:center;width:100%;}
  .exline .reps:focus{outline:none;border-color:var(--clay);}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:var(--mono);font-size:13px;padding:10px 14px;border-radius:var(--radius-row);
    cursor:pointer;border:var(--border);background:var(--white);color:var(--gray-700);
    -webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;gap:6px;
    transition:transform .06s ease;}
  button:active{transform:scale(.97);}
  .btn-warn{background:var(--tint-rust);border-color:var(--rust);color:var(--rust);}
  .btn-ghost{background:transparent;}
  .foot{text-align:center;font-family:var(--mono);font-size:11px;color:var(--gray-500);margin-top:8px;}
  .foot a{color:var(--gray-500);text-decoration:none;}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="titles">
      <span class="eyebrow">Event 004 · Barbell Cycling</span>
      <h1>Barbell Cycling</h1>
      <span class="sub">AMRAP 5 min · 12 DL + 9 FS + 6 S2OH + 3 Thr per round · 50/35 kg</span>
    </div>
  </div>

  <section class="card result">
    <div class="big"><span id="total">0</span><span class="unit">reps</span></div>
    <div class="caption">total reps (all rounds)</div>
    <div class="detail" id="detail"></div>
  </section>

  <div class="nav">
    <button id="prevBtn" aria-label="Previous round">←</button>
    <span class="round-label" id="navLabel">Round 1 / 10</span>
    <button id="nextBtn" aria-label="Next round">→</button>
  </div>

  <section class="card">
    <div class="head">
      <span class="eyebrow">Rounds</span>
      <button id="clearBtn" class="btn-warn" style="padding:7px 12px;font-size:12px;">✕ Clear all</button>
    </div>
    <div class="rounds" id="rounds"></div>
  </section>

  <p class="foot"><a href="index.html">← All events</a> · Enter reps per exercise · all reps count</p>
</div>

<script>
(function(){
  "use strict";
  var ROUNDS=10;
  var EXERCISES=[
    {name:"Deadlifts",target:12},
    {name:"Front Squats",target:9},
    {name:"Shoulder to Overhead",target:6},
    {name:"Thrusters",target:3}
  ];
  var LS_KEY="event004.rounds.v1";

  function defaultState(){
    var s=[];
    for(var i=0;i<ROUNDS;i++){
      var r={};
      for(var j=0;j<EXERCISES.length;j++) r[EXERCISES[j].name]=0;
      s.push(r);
    }
    return s;
  }
  function load(key,fb){
    try{var raw=localStorage.getItem(key);if(raw==null)return fb;
      var p=JSON.parse(raw);if(!Array.isArray(p)||p.length!==ROUNDS)return fb;return p;}
    catch(e){return fb;}
  }
  function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}

  var state=load(LS_KEY,defaultState());
  var currentRound=0;

  function roundReps(r){
    var t=0;
    for(var i=0;i<EXERCISES.length;i++) t+=(r[EXERCISES[i].name]||0);
    return t;
  }
  function totalReps(){
    var t=0,done=0;
    for(var i=0;i<ROUNDS;i++){
      t+=roundReps(state[i]);
      if(roundReps(state[i])>0) done++;
    }
    return {total:t,rounds:done};
  }
  function isRoundDone(r){
    for(var i=0;i<EXERCISES.length;i++){
      if((r[EXERCISES[i].name]||0)>=EXERCISES[i].target) return true;
    }
    return false;
  }

  function render(){
    var wrap=document.getElementById("rounds");
    wrap.innerHTML="";
    for(var i=0;i<ROUNDS;i++){
      (function(i){
        var r=state[i];
        var el=document.createElement("div");
        el.className="round"+(isRoundDone(r)?" done":"");
        el.id="round-"+i;
        var head=document.createElement("div");
        head.className="rhead";
        var num=document.createElement("span");
        num.className="rnum";num.textContent="Round "+(i+1);
        var sum=document.createElement("span");
        sum.className="rsum";sum.textContent=roundReps(r)+" reps";
        head.appendChild(num);head.appendChild(sum);
        el.appendChild(head);
        for(var j=0;j<EXERCISES.length;j++){
          (function(j){
            var ex=EXERCISES[j];
            var line=document.createElement("div");
            line.className="exline";
            var lab=document.createElement("span");
            lab.className="elabel";
            lab.innerHTML=ex.name+' <span class="target">'+ex.target+'</span>';
            var inp=document.createElement("input");
            inp.className="reps";inp.type="number";inp.min="0";inp.step="1";
            inp.value=r[ex.name]||"";inp.placeholder="0";
            inp.setAttribute("aria-label",ex.name+" round "+(i+1));
            inp.addEventListener("input",function(){
              state[i][ex.name]=parseInt(inp.value,10)||0;
              save();render();
            });
            line.appendChild(lab);line.appendChild(inp);
            el.appendChild(line);
          })(j);
        }
        wrap.appendChild(el);
      })(i);
    }
    renderTotal();
    renderNav();
  }
  function renderTotal(){
    var t=totalReps();
    document.getElementById("total").textContent=t.total;
    document.getElementById("detail").textContent=t.rounds+" of "+ROUNDS+" rounds with reps";
  }
  function renderNav(){
    document.getElementById("navLabel").textContent="Round "+(currentRound+1)+" / "+ROUNDS;
    document.getElementById("prevBtn").disabled=currentRound===0;
    document.getElementById("nextBtn").disabled=currentRound===ROUNDS-1;
    var el=document.getElementById("round-"+currentRound);
    if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"});
  }

  document.getElementById("prevBtn").addEventListener("click",function(){
    if(currentRound>0){currentRound--;renderNav();}
  });
  document.getElementById("nextBtn").addEventListener("click",function(){
    if(currentRound<ROUNDS-1){currentRound++;renderNav();}
  });
  document.getElementById("clearBtn").addEventListener("click",function(){
    state=defaultState();save();render();
  });
  render();
})();
</script>
</body>
</html>
